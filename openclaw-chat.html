<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYS.TERMINAL // OPENCLAW</title>
    <style>
        :root {
            --bg-void:        #030303;
            --bg-panel:       rgba(8, 8, 10, 0.8);
            --bg-elevated:    rgba(16, 16, 20, 0.92);
            --bg-input:       rgba(6, 6, 9, 0.90);
            --border-dim:     rgba(28, 28, 34, 0.9);
            --border-mid:     rgba(40, 40, 50, 0.9);
            --border-glow:    rgba(58, 58, 65, 0.95);
            --accent-cyan:    #00e5ff;
            --accent-cyan-d:  rgba(0, 229, 255, 0.13);
            --accent-cyan-g:  rgba(0, 229, 255, 0.28);
            --accent-amber:   #ffb300;
            --accent-amber-d: rgba(255, 179, 0, 0.10);
            --accent-amber-g: rgba(255, 179, 0, 0.20);
            --accent-red:     #ff3d3d;
            --accent-green:   #00ff88;
            --text-primary:   #e0e0ea;
            --text-secondary: #72728a;
            --text-dim:       #3a3a4e;
            --font: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
        }

        /* ── RESET ─────────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html { background: transparent !important; }
        
        body {
            width: 100vw; height: 100vh; overflow: hidden;
            font-family: var(--font); color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            background: #020202; transition: background 0.1s ease-out;
        }
        body.transparent-ready { background: transparent; }

        /* ── WIDGET ────────────────────────────────────────── */
        #widget {
            width: 100%; height: 100%; display: flex; flex-direction: column;
            background: var(--bg-panel); border: 1px solid var(--border-glow);
            box-shadow: 0 0 0 1px #0005, 0 30px 90px -15px #00000080, 0 0 50px -12px var(--accent-cyan-d);
            overflow: hidden; transform: translateZ(0); will-change: contents;
        }
        #widget.repaint { border-color: rgba(0, 229, 255, 0.01); }

        /* Corner Brackets */
        .ca { position: absolute; width: 16px; height: 16px; border: 1.5px solid var(--accent-cyan); pointer-events: none; z-index: 9; }
        .ca-tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
        .ca-tr { top: -1px; right: -1px; border-left: none; border-bottom: none; }
        .ca-bl { bottom: -1px; left: -1px; border-right: none; border-top: none; }
        .ca-br { bottom: -1px; right: -1px; border-left: none; border-top: none; }

        /* ── TITLE BAR ───────────────────────────────────── */
        #title-bar {
            height: 46px; display: flex; align-items: center; justify-content: space-between;
            padding: 0 12px 0 16px; background: linear-gradient(180deg, rgba(20,20,26,0.98) 0%, rgba(14,14,18,0.98) 100%);
            border-bottom: 1px solid var(--border-dim); flex-shrink: 0; -webkit-app-region: drag; app-region: drag;
        }
        #title-left { display: flex; align-items: center; gap: 12px; }
        .conn-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-green); box-shadow: 0 0 7px var(--accent-green); animation: dot-pulse 2.8s ease-in-out infinite; flex-shrink: 0; }
        .conn-dot.offline { background: var(--accent-red); box-shadow: 0 0 7px var(--accent-red); animation: none; }
        @keyframes dot-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
        #title-text { display: flex; flex-direction: column; gap: 2px; }
        #title-text .t1 { font-size: 11px; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase; }
        #title-text .t2 { font-size: 8px; letter-spacing: 0.22em; color: var(--text-dim); text-transform: uppercase; }
        #title-right { display: flex; align-items: center; gap: 6px; -webkit-app-region: no-drag; app-region: no-drag; }
        .hex-badge { font-size: 8px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); padding: 2px 8px; border: 1px solid var(--border-dim); clip-path: polygon(5px 0, 100% 0, 100% calc(100% - 5px), calc(100% - 5px) 100%, 0 100%, 0 5px); }
        .ctrl-btn { width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; background: transparent; border: 1px solid var(--border-mid); color: var(--text-secondary); cursor: pointer; transition: all 0.14s ease; clip-path: polygon(4px 0, 100% 0, 100% calc(100% - 4px), calc(100% - 4px) 100%, 0 100%, 0 4px); }
        .ctrl-btn svg { width: 10px; height: 10px; stroke: currentColor; stroke-width: 2.2; fill: none; }
        .ctrl-btn:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); background: var(--accent-cyan-d); box-shadow: 0 0 12px var(--accent-cyan-d); }
        .ctrl-btn.close:hover { border-color: var(--accent-red); color: var(--accent-red); background: rgba(255,61,61,0.13); box-shadow: 0 0 12px rgba(255,61,61,0.2); }

        /* ── LAYOUT: MAIN CONTENT WRAPPER ────────────────── */
        /* 🚀 核心架构升级：横向 Flex，包裹聊天区和侧边栏 */
        #main-wrapper {
            flex: 1; display: flex; flex-direction: row; overflow: hidden; min-height: 0;
        }

        /* ── CHAT BODY ───────────────────────────────────── */
        #chat-body { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
        #message-area { flex: 1; overflow-y: auto; padding: 24px 20px; display: flex; flex-direction: column; gap: 22px; scroll-behavior: smooth; background: transparent; min-height: 0; }
        #message-area::-webkit-scrollbar { width: 5px; }
        #message-area::-webkit-scrollbar-track { background: transparent; }
        #message-area::-webkit-scrollbar-thumb { background: var(--border-mid); border-radius: 3px; }
        #message-area::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

        /* Chat Rows (from previous avant-garde design) */
        .term-row { display: flex; gap: 16px; align-items: flex-start; animation: row-appear 0.2s ease-out forwards; }
        @keyframes row-appear { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
        .term-meta { width: 120px; flex-shrink: 0; text-align: right; display: flex; flex-direction: column; gap: 2px; user-select: none; padding-top: 2px; }
        .term-meta .role { font-size: 11px; font-weight: 800; letter-spacing: 0.1em; }
        .term-meta .ts { font-size: 9px; color: var(--text-dim); font-family: monospace; letter-spacing: 0.05em; }
        .term-content { flex: 1; border-left: 2px solid var(--border-dim); padding-left: 16px; font-size: 12.5px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; color: var(--text-primary); }
        .term-row.user .role { color: var(--accent-cyan); text-shadow: 0 0 5px var(--accent-cyan-d); }
        .term-row.user .term-content { border-left-color: var(--accent-cyan-g); color: #e0f4ff; }
        .term-row.agent .role { color: var(--accent-amber); text-shadow: 0 0 5px var(--accent-amber-d); }
        .term-row.agent .term-content { border-left-color: var(--accent-amber-g); }
        .term-row.sys .role { color: var(--accent-green); }
        .term-row.sys .term-content { border-left-color: var(--accent-green); color: var(--text-secondary); font-size: 11px; }
        .term-row.sys.error .role { color: var(--accent-red); }
        .term-row.sys.error .term-content { border-left-color: var(--accent-red); color: #ff8888; }
        .sys-trace { margin: 4px 0 10px 0; font-size: 11px; }
        .trace-header { color: var(--text-dim); cursor: pointer; user-select: none; display: inline-flex; align-items: center; gap: 6px; transition: color 0.2s; }
        .trace-header:hover { color: var(--accent-amber); }
        .trace-header svg { width: 10px; height: 10px; transition: transform 0.2s; stroke: currentColor; fill: none; stroke-width: 2; }
        .trace-header.open svg { transform: rotate(90deg); }
        .trace-body { margin-top: 6px; padding: 4px 0 4px 12px; border-left: 1px dashed var(--text-dim); color: var(--text-secondary); display: none; animation: row-appear 0.2s ease-out; }
        .trace-header.open + .trace-body { display: block; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        .cursor-blink { display: inline-block; width: 7px; height: 13px; background: var(--accent-amber); animation: blink 1s step-end infinite; vertical-align: baseline; margin-left: 2px; position: relative; top: 1px; }

        /* ── ELASTIC DDL SIDEBAR (NEW) ───────────────────── */
        #ddl-sidebar {
            width: 36px; /* 默认收缩态 */
            background: rgba(12, 12, 16, 0.6);
            border-left: 1px solid var(--border-dim);
            transition: width 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), background 0.3s;
            display: flex; flex-direction: column; overflow: hidden;
            position: relative; flex-shrink: 0;
        }
        #ddl-sidebar.expanded {
            width: 320px; /* 展开态宽度 */
            background: rgba(12, 12, 16, 0.95);
            box-shadow: -10px 0 30px rgba(0,0,0,0.5);
        }

        /* 状态 1: 收缩态 (Collapsed View) */
        .sidebar-collapsed {
            position: absolute; top: 0; left: 0; width: 36px; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            padding-top: 20px; cursor: pointer; transition: opacity 0.2s; z-index: 2;
        }
        #ddl-sidebar.expanded .sidebar-collapsed { opacity: 0; pointer-events: none; }
        .sidebar-collapsed:hover { background: rgba(255,255,255,0.03); }
        .vert-text {
            writing-mode: vertical-rl; text-orientation: mixed;
            font-size: 10px; letter-spacing: 0.2em; color: var(--text-dim);
            font-weight: 800; margin-bottom: 20px;
        }
        .ind-box { display: flex; flex-direction: column; gap: 8px; }
        .ind-dot {
            width: 14px; height: 14px; border-radius: 2px;
            display: flex; align-items: center; justify-content: center;
            font-size: 9px; font-weight: bold; color: #000;
            opacity: 0.3; transition: all 0.3s;
        }
        .ind-dot.active { opacity: 1; box-shadow: 0 0 10px currentColor; }
        .ind-dot.danger { background: var(--accent-red); color: var(--accent-red); }
        .ind-dot.danger.active { color: #fff; }
        .ind-dot.warn { background: var(--accent-amber); color: var(--accent-amber); }
        .ind-dot.warn.active { color: #000; }
        .ind-dot.safe { background: var(--accent-cyan); color: var(--accent-cyan); }
        .ind-dot.safe.active { color: #000; }

        /* 状态 2: 展开态 (Expanded View) */
        .sidebar-expanded {
            position: absolute; top: 0; left: 0; width: 320px; height: 100%;
            display: flex; flex-direction: column; opacity: 0; pointer-events: none;
            transition: opacity 0.3s 0.1s; padding: 20px 16px;
        }
        #ddl-sidebar.expanded .sidebar-expanded { opacity: 1; pointer-events: auto; }
        
        .sd-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px dashed var(--border-mid); padding-bottom: 12px; margin-bottom: 16px;
        }
        .sd-header h2 { font-size: 14px; letter-spacing: 0.15em; color: var(--accent-amber); margin: 0; font-weight: 800; }
        .sd-close { cursor: pointer; color: var(--text-dim); font-size: 18px; line-height: 1; transition: color 0.2s; }
        .sd-close:hover { color: var(--accent-red); }

        .sd-list { flex: 1; overflow-y: auto; list-style: none; margin: 0; padding: 0; padding-right: 4px; }
        .sd-list::-webkit-scrollbar { width: 3px; }
        .sd-list::-webkit-scrollbar-thumb { background: var(--border-dim); }

        .task-item {
            display: flex; align-items: flex-start; padding: 10px;
            background: rgba(255,255,255,0.02); border-left: 2px solid transparent;
            margin-bottom: 8px; transition: all 0.2s; position: relative;
        }
        .task-item:hover { border-left-color: var(--accent-amber); background: rgba(255,179,0,0.05); }
        .task-item.completed { opacity: 0.4; border-left-color: var(--border-mid); }
        
        .task-checkbox {
            width: 14px; height: 14px; border: 1px solid var(--accent-amber);
            margin-right: 12px; margin-top: 2px; cursor: pointer; flex-shrink: 0;
            display: flex; justify-content: center; align-items: center; transition: all 0.2s;
        }
        .task-item.completed .task-checkbox { background: var(--border-mid); border-color: var(--border-mid); }
        .task-item.completed .task-checkbox::after { content: "✓"; color: #000; font-size: 10px; font-weight: bold; }
        
        .task-content { flex: 1; display: flex; flex-direction: column; gap: 4px; overflow: hidden; }
        .task-text { font-size: 11.5px; color: var(--text-primary); word-break: break-all; line-height: 1.4; transition: color 0.2s; }
        .task-item.completed .task-text { text-decoration: line-through; color: var(--text-dim); }
        
        .task-meta { display: flex; align-items: center; gap: 8px; }
        .ddl-badge { font-size: 9px; padding: 2px 6px; background: rgba(255,255,255,0.05); color: var(--text-secondary); border-radius: 2px; letter-spacing: 0.05em; }
        .ddl-badge.danger { background: rgba(255,61,61,0.15); color: var(--accent-red); border: 1px solid rgba(255,61,61,0.3); }
        .ddl-badge.warn { background: rgba(255,179,0,0.15); color: var(--accent-amber); border: 1px solid rgba(255,179,0,0.3); }

        .task-del {
            background: none; border: none; color: var(--accent-red); font-size: 14px;
            cursor: pointer; opacity: 0; padding: 0 4px; transition: opacity 0.2s;
        }
        .task-item:hover .task-del { opacity: 1; }

        /* ── INPUT AREA ──────────────────────────────────── */
        #input-area { padding: 12px 20px 16px; flex-shrink: 0; background: transparent; border-top: 1px solid var(--border-dim); }
        #input-shell { display: flex; align-items: flex-end; gap: 0; background: var(--bg-input); border: 1px solid var(--border-mid); border-radius: 2px; padding: 8px 12px; transition: border-color 0.18s, box-shadow 0.18s; }
        #input-shell:focus-within { border-color: var(--accent-cyan); box-shadow: 0 0 0 1px var(--accent-cyan-d), 0 0 28px -6px var(--accent-cyan-d); }
        #prompt-label { font-size: 10px; font-weight: 800; color: var(--accent-cyan); letter-spacing: 0.03em; flex-shrink: 0; padding-right: 10px; padding-bottom: 2px; opacity: 0.85; }
        #message-input { flex: 1; background: transparent; border: none; outline: none; color: var(--text-primary); font-family: var(--font); font-size: 12.5px; line-height: 1.65; resize: none; min-height: 24px; max-height: 150px; field-sizing: content; caret-color: var(--accent-cyan); }
        #message-input::placeholder { color: var(--text-dim); }
        #send-btn { flex-shrink: 0; margin-left: 10px; padding: 7px 16px; background: linear-gradient(180deg, rgba(36,36,46,0.98) 0%, rgba(22,22,29,0.98) 100%); border: 1px solid var(--border-mid); border-radius: 2px; color: var(--text-secondary); font-family: var(--font); font-size: 9px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; cursor: pointer; transition: all 0.14s ease; }
        #send-btn:hover { background: linear-gradient(180deg, var(--accent-cyan) 0%, #00bdd6 100%); border-color: var(--accent-cyan); color: #000; box-shadow: 0 0 20px var(--accent-cyan-d); }
        #input-hint { font-size: 8px; color: var(--text-dim); margin-top: 6px; letter-spacing: 0.05em; text-align: right; padding-right: 2px; }

        /* ── FILE UPLOAD ────────────────────────────────── */
        #file-input { display: none; }
        #attach-btn {
            flex-shrink: 0; margin-right: 6px; padding: 7px 10px;
            background: linear-gradient(180deg, rgba(36,36,46,0.98) 0%, rgba(22,22,29,0.98) 100%);
            border: 1px solid var(--border-mid); border-radius: 2px;
            color: var(--text-secondary); font-family: var(--font); font-size: 9px;
            cursor: pointer; transition: all 0.14s ease;
        }
        #attach-btn:hover { border-color: var(--accent-amber); color: var(--accent-amber); background: var(--accent-amber-d); }
        #attach-btn.uploading { opacity: 0.5; pointer-events: none; }
        #preview-area { display: none; padding: 8px 20px 0; flex-shrink: 0; }
        #preview-area.visible { display: block; }
        .preview-item { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: rgba(255,179,0,0.05); border: 1px dashed var(--accent-amber); margin-bottom: 6px; }
        .preview-item img { max-height: 60px; max-width: 120px; border-radius: 2px; }
        .preview-name { flex: 1; font-size: 10px; color: var(--text-secondary); }
        .preview-remove { background: none; border: none; color: var(--accent-red); cursor: pointer; font-size: 14px; padding: 0 4px; }
    </style>
</head>
<body>

<div id="widget">
    <div class="ca ca-tl"></div><div class="ca ca-tr"></div>
    <div class="ca ca-bl"></div><div class="ca ca-br"></div>

    <div id="title-bar">
        <div id="title-left">
            <div class="conn-dot" id="ws-dot"></div>
            <div id="title-text">
                <div class="t1">OPENCLAW.EXE</div>
                <div class="t2">LOCAL_HOST // ROOT_ACCESS</div>
            </div>
        </div>
        <div id="title-right">
            <div class="hex-badge" id="hex-badge">v1.2_AGENT</div>
            <button class="ctrl-btn" id="btn-min" title="Minimize"><svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
            <button class="ctrl-btn" id="btn-max" title="Maximize"><svg id="max-icon" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1" stroke="currentColor" stroke-width="2" fill="none"/></svg></button>
            <button class="ctrl-btn close" id="btn-close" title="Close window"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
        </div>
    </div>

    <!-- 🚀 核心架构包裹器 -->
    <div id="main-wrapper">
        <div id="chat-body">
            <div id="message-area"></div>
        </div>

        <!-- 🚀 弹性 DDL 侧边栏 -->
        <div id="ddl-sidebar">
            <!-- 缩小态 -->
            <div class="sidebar-collapsed" onclick="toggleSidebar(true)" title="Expand Directives">
                <div class="vert-text">DIRECTIVES</div>
                <div class="ind-box">
                    <div class="ind-dot danger" id="ind-danger">0</div>
                    <div class="ind-dot warn" id="ind-warn">0</div>
                    <div class="ind-dot safe" id="ind-safe">0</div>
                </div>
            </div>
            <!-- 展开态 -->
            <div class="sidebar-expanded">
                <div class="sd-header">
                    <h2>PRTS_DIRECTIVES</h2>
                    <span class="sd-close" onclick="toggleSidebar(false)">×</span>
                </div>
                <ul class="sd-list" id="ddl-list">
                    <!-- 动态生成任务 -->
                    <li style="color: var(--text-dim); font-size: 11px;">[SYS] 正在同步数据链路...</li>
                </ul>
            </div>
        </div>
    </div>

    <div id="input-area">
        <div id="preview-area">
            <!-- 动态生成预览 -->
        </div>
        <div id="input-shell">
            <span id="prompt-label">C:\OC\&gt;</span>
            <textarea id="message-input" placeholder="Awaiting protocol injection..." rows="1" autocomplete="off"></textarea>
            <button id="attach-btn" title="Attach image">+FILE</button>
            <button id="send-btn">EXEC</button>
        </div>
        <div id="input-hint">ENTER to execute &nbsp;&middot;&nbsp; SHIFT+ENTER for newline &nbsp;&middot;&nbsp; 拖拽图片也行</div>
    </div>
    <input type="file" id="file-input" accept="image/*" multiple>
</div>

<script>
(function () {
    'use strict';

    /* ── DOM REFS ─────────────────────────────────────── */
    const widget   = document.getElementById('widget');
    const msgArea  = document.getElementById('message-area');
    const msgInput = document.getElementById('message-input');
    const sendBtn  = document.getElementById('send-btn');
    const btnMin   = document.getElementById('btn-min');
    const btnMax   = document.getElementById('btn-max');
    const btnClose = document.getElementById('btn-close');
    const wsDot    = document.getElementById('ws-dot');
    const maxIcon  = document.getElementById('max-icon');
    
    // DDL Refs
    const sidebar  = document.getElementById('ddl-sidebar');
    const ddlList  = document.getElementById('ddl-list');
    const indDanger= document.getElementById('ind-danger');
    const indWarn  = document.getElementById('ind-warn');
    const indSafe  = document.getElementById('ind-safe');

    let isMaximized = false;
    let currentAgentRow = null; 

    setTimeout(() => { document.body.classList.add('transparent-ready'); }, 200);

    /* ── WINDOW CONTROLS ──────────────────────────────── */
    btnMin.addEventListener('click', () => { if (window.pywebview) window.pywebview.api.minimize(); });
    btnClose.addEventListener('click', () => { if (window.pywebview) window.pywebview.api.shutdown(); });
    btnMax.addEventListener('click', () => {
        if (window.pywebview && window.pywebview.api) {
            widget.classList.add('repaint'); requestAnimationFrame(() => requestAnimationFrame(() => widget.classList.remove('repaint')));
            const nowMax = window.pywebview.api.toggle_maximize();
            isMaximized = nowMax;
            maxIcon.innerHTML = nowMax ? '<path d="M8 3H5a2 2 0 0 0-2 2v3m14 0V5a2 2 0 0 0-2-2h-3m0 14h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" stroke="currentColor" stroke-width="2" fill="none"/>' : '<rect x="4" y="4" width="16" height="16" rx="1" stroke="currentColor" stroke-width="2" fill="none"/>';
            setTimeout(() => { widget.classList.add('repaint'); requestAnimationFrame(() => requestAnimationFrame(() => widget.classList.remove('repaint'))); }, 120);
        }
    });

    /* ── DDL SIDEBAR LOGIC 🚀 ─────────────────────────── */
    window.toggleSidebar = function(expand) {
        if (expand) sidebar.classList.add('expanded');
        else sidebar.classList.remove('expanded');
    };

    /* ── FILE ATTACHMENT LOGIC ───────────────────────── */
    const fileInput = document.getElementById('file-input');
    const attachBtn = document.getElementById('attach-btn');
    const previewArea = document.getElementById('preview-area');
    let pendingAttachments = []; // 待发送的附件队列，现在它自由了！

    function addToPreview(file, dataUrl) {
        previewArea.classList.add('visible');
        const item = document.createElement('div');
        item.className = 'preview-item';
        item.dataset.name = file.name;
        item.dataset.data = dataUrl;
        item.dataset.type = file.type;
        item.innerHTML = `
            <img src="${dataUrl}" alt="${esc(file.name)}">
            <span class="preview-name">${esc(file.name)}</span>
            <button class="preview-remove" title="移除">×</button>
        `;
        item.querySelector('.preview-remove').addEventListener('click', () => {
            pendingAttachments = pendingAttachments.filter(a => a.name !== file.name);
            item.remove();
            if (pendingAttachments.length === 0) previewArea.classList.remove('visible');
        });
        previewArea.appendChild(item);
    }

    function handleFiles(files) {
        Array.from(files).forEach(file => {
            if (!file.type.startsWith('image/')) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const dataUrl = e.target.result;
                const base64 = dataUrl.split(',')[1];
                pendingAttachments.push({
                    name: file.name,
                    type: file.type,
                    data: base64
                });
                addToPreview(file, dataUrl);
            };
            reader.readAsDataURL(file);
        });
    }

    attachBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

    // 🚀 拖拽支持
    document.body.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.stopPropagation();
    });
    document.body.addEventListener('drop', (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (e.dataTransfer.files.length > 0) {
            handleFiles(e.dataTransfer.files);
        }
    });

    function renderDDL(data) {
        if (!data) return;
        
        // 1. 更新呼吸灯
        const sum = data.summary;
        indDanger.textContent = sum.danger;
        indDanger.className = `ind-dot danger ${sum.danger > 0 ? 'active' : ''}`;
        indWarn.textContent = sum.warning;
        indWarn.className = `ind-dot warn ${sum.warning > 0 ? 'active' : ''}`;
        indSafe.textContent = sum.safe;
        indSafe.className = `ind-dot safe ${sum.safe > 0 ? 'active' : ''}`;

        // 2. 渲染列表
        ddlList.innerHTML = '';
        if (!data.tasks || data.tasks.length === 0) {
            ddlList.innerHTML = '<li style="color: var(--text-dim); font-size: 11px; padding: 10px;">[SYS] 队列为空。</li>';
            return;
        }

        const now = Date.now();
        data.tasks.forEach(task => {
            const li = document.createElement('li');
            li.className = `task-item ${task.completed ? 'completed' : ''}`;
            
            let badgeHTML = '';
            if (task.ddl && !task.completed) {
                const hoursLeft = (task.ddl - now) / (1000 * 60 * 60);
                let badgeClass = 'safe';
                if (hoursLeft < 24) badgeClass = 'danger';
                else if (hoursLeft < 72) badgeClass = 'warn';
                
                const d = new Date(task.ddl);
                const dateStr = `${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:00`;
                badgeHTML = `<span class="ddl-badge ${badgeClass}">${dateStr}</span>`;
            }

            li.innerHTML = `
                <div class="task-checkbox"></div>
                <div class="task-content">
                    <div class="task-text">${esc(task.text)}</div>
                    ${badgeHTML ? `<div class="task-meta">${badgeHTML}</div>` : ''}
                </div>
                <button class="task-del" title="Delete">×</button>
            `;

            li.querySelector('.task-checkbox').addEventListener('click', async () => {
                if(window.pywebview) renderDDL(await window.pywebview.api.toggle_ddl(task.id));
            });
            li.querySelector('.task-del').addEventListener('click', async () => {
                if(window.pywebview) renderDDL(await window.pywebview.api.delete_ddl(task.id));
            });

            ddlList.appendChild(li);
        });
    }

    // 初始化拉取 DDL 数据
    async function initDDL() {
        if (window.pywebview && window.pywebview.api) {
            const data = await window.pywebview.api.get_ddls();
            renderDDL(data);
        }
    }
    window.addEventListener('pywebviewready', initDDL);


    /* ── WEBSOCKET & CHAT LOGIC ───────────────────────── */
    function setOnline()  { wsDot.classList.remove('offline'); }
    function setOffline() { wsDot.classList.add('offline'); }

    const ws = new WebSocket(`ws://${window.location.host}/ws`);
    ws.addEventListener('open',   setOnline);
    ws.addEventListener('close',  setOffline);
    ws.addEventListener('error',  setOffline);
    ws.addEventListener('message', (ev) => {
        try {
            const d = JSON.parse(ev.data);
            if (d.type === 'reply') handleRaw(JSON.parse(d.content));
            else if (d.type === 'error') appendSys(d.content, 'error');
        } catch (_) {}
    });

    function esc(str) { return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function br(str) { return esc(str).replace(/\r?\n/g, '<br>'); }
    function ts() { const d = new Date(); return `[${[d.getHours(),d.getMinutes(),d.getSeconds()].map(n=>String(n).padStart(2,'0')).join(':')}]`; }

    window.toggleTrace = function(el) { el.classList.toggle('open'); };

    function appendSys(text, type = 'sys') {
        const el = document.createElement('div'); el.className = `term-row sys ${type === 'error' ? 'error' : ''}`;
        el.innerHTML = `<div class="term-meta"><span class="role">SYS.LOG</span><span class="ts">${ts()}</span></div><div class="term-content">${br(text)}</div>`;
        msgArea.appendChild(el); msgArea.scrollTop = msgArea.scrollHeight;
    }

    function appendUser(text) {
        currentAgentRow = null; 
        const el = document.createElement('div'); el.className = 'term-row user';
        el.innerHTML = `<div class="term-meta"><span class="role">OPERATOR</span><span class="ts">${ts()}</span></div><div class="term-content">${br(text)}</div>`;
        msgArea.appendChild(el); msgArea.scrollTop = msgArea.scrollHeight;
    }

    function ensureAgentRow() {
        if (currentAgentRow) return currentAgentRow;
        const el = document.createElement('div'); el.className = 'term-row agent';
        el.innerHTML = `<div class="term-meta"><span class="role">OPENCLAW</span><span class="ts">${ts()}</span></div><div class="term-content"><div class="trace-container"></div><div class="text-container"><span class="cursor-blink"></span></div></div>`;
        msgArea.appendChild(el); msgArea.scrollTop = msgArea.scrollHeight;
        return currentAgentRow = { el: el, traceContainer: el.querySelector('.trace-container'), textContainer: el.querySelector('.text-container'), fullText: '', thoughts: [] };
    }

    function renderAgentRow(row, isDone) {
        if (row.thoughts.length > 0) {
            row.traceContainer.innerHTML = `<div class="sys-trace"><div class="trace-header ${row.thoughts.length < 300 ? 'open' : ''}" onclick="toggleTrace(this)"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>[>] COGNITIVE_TRACE_LOG</div><div class="trace-body">${br(row.thoughts.join('\n\n'))}</div></div>`;
        }
        row.textContainer.innerHTML = (row.fullText ? br(row.fullText) : '<span style="opacity:0.3;font-style:italic">Receiving datastream...</span>') + (isDone ? '' : '<span class="cursor-blink"></span>');
        msgArea.scrollTop = msgArea.scrollHeight;
    }

    const NOISE = new Set(['tick','heartbeat','presence','health','pong','sessions.list','session.list','auth.ok','connected','subscribed','agent.status','system.ready','content.block_started','content.block_done','session.updated','null','undefined']);
    const SYS_BLACKLIST = ['who am i','identity setup','bootstrap','system prompt','instruct you','you are an ai','role: system','role:{"role":"system','base prompt','core system','system configuration','you are a','perspective you take','背后系统设定','系统引导'];
    function isSystemPrompt(text) { if (!text || typeof text !== 'string') return false; const l = text.toLowerCase().trim(); return (!l || l === 'null' || l === 'undefined' || l === 'none' || SYS_BLACKLIST.some(kw => l.includes(kw))); }
    function isDoneSignal(p) { return p?.payload?.state === 'final' || (p?.payload?.stream === 'lifecycle' && p?.payload?.data?.phase === 'end'); }

    function handleRaw(p) {
        const ev = (p.event || p.type || '');
        if (NOISE.has(ev.toLowerCase()) || !ev || (ev !== 'agent' && ev !== 'chat') || (p?.payload?.stream === 'lifecycle' && p?.payload?.data?.phase === 'start')) return;

        const fullText = p?.payload?.data?.text || p?.payload?.message?.content?.[0]?.text || null;
        const delta = p?.payload?.data?.delta || null;
        const thinkingRaw = p?.payload?.data?.thinking || p?.payload?.message?.thinking || null;

        const thoughts = [];
        if (typeof thinkingRaw === 'string' && thinkingRaw.trim()) thoughts.push(thinkingRaw);
        else if (Array.isArray(thinkingRaw)) thinkingRaw.forEach(t => { if (typeof t === 'string' && t.trim()) thoughts.push(t); });

        const userText = p?.userMessage || null;
        const text = (fullText && typeof fullText === 'string' && fullText.trim()) ? fullText : (delta && typeof delta === 'string' && delta.trim() ? delta : '');

        if ((fullText && isSystemPrompt(fullText)) || (delta && isSystemPrompt(delta))) return;
        if (userText && typeof userText === 'string' && userText.trim() && !isSystemPrompt(userText)) appendUser(userText);
        if (!text && thoughts.length === 0) return;

        const row = ensureAgentRow();
        if (fullText) row.fullText = fullText; else if (delta) row.fullText += delta;
        thoughts.forEach(t => { if (!row.thoughts.includes(t)) row.thoughts.push(t); });
        
        const isDone = isDoneSignal(p);
        renderAgentRow(row, isDone);

        // 🚀 核心联动：只要 OpenClaw 执行完毕或发言结束，强制刷新 DDL 侧边栏！
        if (isDone) {
            initDDL();
        }
    }

    function send() {
        const text = msgInput.value.trim();
        
        // 如果有附件，先发送附件消息
        if (pendingAttachments.length > 0) {
            // 显示用户消息（带附件提示）
            const attachmentNote = pendingAttachments.map(a => `[图片: ${a.name}]`).join(' ');
            appendUser(text ? `${text}\n${attachmentNote}` : attachmentNote);
            
            // 依次发送每个附件
            pendingAttachments.forEach(att => {
                const msg = JSON.stringify({
                    type: "attachment",
                    filename: att.name,
                    mimeType: att.type,
                    data: att.data,
                    text: text // 第一个附件带文本，后续的空
                });
                if (ws.readyState === WebSocket.OPEN) ws.send(msg);
            });
            
            // 清空附件队列和输入框
            pendingAttachments = [];
            previewArea.innerHTML = '';
            previewArea.classList.remove('visible');
            msgInput.value = '';
            msgInput.style.height = 'auto';
            return;
        }

        if (!text) return;

        // 🚀 新增：本地高优先指令拦截器
        if (text.startsWith('/add ')) {
            appendUser(text);
            const content = text.substring(5).trim();
            
            // 正则匹配末尾的 4位或6位数字时间戳，例如: /add 操作系统大作业 0415
            const ddlMatch = content.match(/\s+(\d{4}|\d{6})$/);
            // 🚀 支持末尾的 # 标记（每日重置任务）
            const hasRecurring = content.endsWith(' #');
            let taskText = content.replace(/\s+#$/, ''); // 去掉 # 标记
            let ddlTime = null;

            if (ddlMatch) {
                taskText = taskText.replace(/\s+(\d{4}|\d{6})$/, '').trim();
                const nums = ddlMatch[1];
                const now = new Date();
                let mm = parseInt(nums.substring(0, 2)) - 1;
                let dd = parseInt(nums.substring(2, 4));
                let hh = nums.length === 6 ? parseInt(nums.substring(4, 6)) : 23;
                let yyyy = now.getFullYear();
                if (mm < now.getMonth() - 1) yyyy += 1;
                
                ddlTime = new Date(yyyy, mm, dd, hh, 0).getTime();
            }

            // 越过大模型，直接调用底层 Python API 添加任务
            if (window.pywebview && window.pywebview.api) {
                window.pywebview.api.add_ddl(taskText, ddlTime, hasRecurring).then(data => {
                    renderDDL(data);
                    const tag = hasRecurring ? '[DAILY_RESET]' : '';
                    appendSys(`[LOCAL_EXEC] 任务已写入 PRTS 档案${tag}: ${taskText}`, 'sys');
                });
            } else {
                appendSys(`[ERROR] 无法连接底层 API 接口。`, 'error');
            }

            msgInput.value = ''; 
            msgInput.style.height = 'auto';
            return; // 拦截成功，直接返回，不再发送给 WebSocket 网关
        }

        // 如果不是本地指令，则按原样上墙并发送给 OpenClaw
        appendUser(text);
        msgInput.value = ''; msgInput.style.height = 'auto';
        if (ws.readyState === WebSocket.OPEN) ws.send(text);
        else appendSys('UPLINK DISCONNECTED — Directives cannot be routed.', 'error');
    }

    msgInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
    msgInput.addEventListener('input', () => { msgInput.style.height = 'auto'; msgInput.style.height = Math.min(msgInput.scrollHeight, 150) + 'px'; });
    sendBtn.addEventListener('click', send);
    msgArea.addEventListener('click', (e) => { if (!e.target.closest('details, summary, .trace-header, button, a, .task-item, .sidebar-collapsed')) msgInput.focus(); });

    appendSys("OpenClaw Local Terminal [Version 1.2.0]\n(c) 2026 Core Systems. All rights reserved.\n\nInitializing secure channel... [OK]\nMounting PRTS directives... [OK]\nEstablishing link to core... [OK]\n\n► SYSTEM READY — Awaiting operator input.");
})();
</script>
